name: Presentación (Sesión 1)
description: Preséntate y registra la dirección de testnet que creaste en la Sesión 1.
title: "Presentación: "
labels: ["sesion-1", "presentacion"]
body:
  - type: markdown
    attributes:
      value: |
        Bienvenido a **Stellar Campus Barranquilla**. Llena los campos y publica.
        Toma dos minutos.

        No necesitas poner tu usuario de GitHub: ya lo sabemos, es la cuenta con la
        que estás abriendo este issue.

  - type: input
    id: nombre
    attributes:
      label: Nombre completo
      placeholder: María Fernanda Pérez
    validations:
      required: true

  - type: dropdown
    id: sesion
    attributes:
      label: ¿A cuál sesión asististe?
      options:
        - Miércoles 26 de agosto — Universidad de la Costa (CUC)
        - Jueves 27 de agosto — Universidad del Norte
    validations:
      required: true

  - type: input
    id: direccion
    attributes:
      label: Tu dirección pública de testnet
      description: La que creaste en Stellar Lab. Empieza por G y tiene 56 caracteres.
      placeholder: GXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
    validations:
      required: true

  - type: input
    id: hash
    attributes:
      label: Hash de tu transacción (opcional)
      description: Los 64 caracteres que te devolvió el Lab al enviar los 10 XLM.
    validations:
      required: false

  - type: textarea
    id: perfil
    attributes:
      label: Cuéntanos de ti
      description: >-
        ¿Estudias, trabajas, o las dos? ¿Qué carrera o profesión? ¿A qué te dedicas
        hoy? Si programas, en qué lenguajes te mueves; y si no programas, tampoco pasa
        nada — aquí hay gente de todos los perfiles. Dos o tres líneas bastan.
      placeholder: >-
        Estudio Ingeniería de Sistemas en la CUC, voy en séptimo semestre. Trabajo
        medio tiempo haciendo soporte y me defiendo en Python y algo de JavaScript.
        Nunca había tocado nada de blockchain antes de hoy.
    validations:
      required: true

  - type: textarea
    id: expectativa
    attributes:
      label: ¿Qué esperas del programa?
      description: Una o dos líneas. Qué te trajo y qué te gustaría construir.
    validations:
      required: true
